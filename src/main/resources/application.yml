server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    session:
      timeout: 30m

spring:
  application:
    name: oj
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/oj?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
  jackson:
    # 返回前端的 JSON 下划线兼容（实体用驼峰，这里不做强制转换）
    default-property-inclusion: non_null
  # 文件上传大小限制（课程视频最大 500MB）
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB

# MyBatis-Plus 配置
mybatis-plus:
  type-handlers-package: com.example.oj.platform
  configuration:
    # 开启驼峰自动映射：create_time -> createTime
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      # 主键自增
      id-type: auto
      # 逻辑删除
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

# Knife4j 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.example.oj: debug

# 课程模块本地文件上传配置
oj:
  upload:
    # 本地存储根目录（相对路径会基于工作目录解析为绝对路径）
    base-dir: uploads
    # 文件访问 URL 前缀，由 FileUploadConfig 映射到本地目录
    url-prefix: /uploads
    cover:
      max-size: 5242880          # 5MB
      allowed-ext: jpg,jpeg,png,webp
    video:
      max-size: 524288000        # 500MB
      allowed-ext: mp4,mov,avi,mkv
    ppt:
      max-size: 104857600        # 100MB
      allowed-ext: ppt,pptx,pdf
